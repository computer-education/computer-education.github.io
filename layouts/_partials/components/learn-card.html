<div class="swiper-slide group">
    <div
        class="h-full cursor-pointer rounded-2xl border border-gray-100 bg-white p-3 shadow-lg transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl"
        onclick="window.location.href = '{{ .RelPermalink }}'">
        <div class="relative mb-5 h-48 w-full overflow-hidden rounded-xl">
            <div
                class="absolute inset-0 z-10 bg-gradient-to-t from-black/60 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
            {{ with .Resources.Get .Params.image }}
                <img
                    src="{{ .RelPermalink }}"
                    alt="Programming"
                    class="h-full w-full transform object-cover transition-transform duration-500 group-hover:scale-110" />
            {{ end }}
            {{ with .Params.badge }}
                <div
                    class="absolute bottom-4 left-4 z-20 translate-y-4 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">
                    <span class="rounded-full bg-green-500 px-3 py-1 text-xs font-bold text-white"> {{ . }} </span>
                </div>
            {{ end }}
        </div>
        <div class="px-2 pb-4">
            <h3 class="mb-2 text-2xl font-bold text-gray-900 transition-colors group-hover:text-green-600">
                {{ .Params.title }}
            </h3>
            {{ with .Params.description }}
                <p class="mb-4 line-clamp-2 text-sm leading-relaxed text-gray-500">
                    {{ . }}
                </p>
            {{ end }}
            <span class="inline-flex items-center text-sm font-semibold text-green-600 hover:underline">
                {{ .Params.cta_text }}
                <i class="ph ph-arrow-right ml-2"></i>
            </span>
        </div>
    </div>
</div>
