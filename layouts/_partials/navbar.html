{{ $position := cond .IsHome "fixed" "sticky" }}
<header class="{{ $position }} top-0 right-0 z-50 w-full border-b border-gray-100 bg-white shadow-md transition-all duration-300">
    <div class="container mx-auto flex items-center justify-between px-6 py-3 md:px-12">
        <!-- Logo -->
        <a href="/" class="group flex items-center gap-2">
            {{ with resources.Get "images/logo.png" }}
                <img
                    class="h-10 w-auto transition-transform duration-300 group-hover:scale-110"
                    src="{{ .RelPermalink }}"
                    alt="Logo CE" />
            {{ end }}
        </a>

        <!-- Menu Icon Mobile -->
        <div
            id="menu-icon"
            class="cursor-pointer rounded-lg p-2 inline-flex items-center text-green-600 transition-colors hover:bg-green-50 md:hidden">
            <i class="ph ph-list text-3xl"></i>
        </div>

        <!-- Menu Tengah -->
        <ul
            id="menu-list"
            class="pointer-events-none absolute top-full left-0 flex w-full origin-top -translate-y-4 flex-col gap-6 border-t border-gray-100 bg-white/95 py-8 text-center opacity-0 shadow-lg backdrop-blur-xl transition-all duration-300 ease-in-out md:pointer-events-auto md:static md:w-auto md:translate-y-0 md:flex-row md:gap-8 md:border-0 md:bg-transparent md:py-0 md:opacity-100 md:shadow-none md:backdrop-blur-none">
            <li>
                <a class="nav-link relative font-medium text-gray-700 transition-colors hover:text-green-600" href="/">
                    Home
                </a>
            </li>
            <li>
                <a
                    class="nav-link relative font-medium text-gray-700 transition-colors hover:text-green-600"
                    href="/#about">
                    About Us
                </a>
            </li>
            <li>
                <a
                    class="nav-link relative font-medium text-gray-700 transition-colors hover:text-green-600"
                    href="/#learning">
                    Learning
                </a>
            </li>
            <li>
                <a
                    class="nav-link relative font-medium text-gray-700 transition-colors hover:text-green-600"
                    href="/#pengurus">
                    Pengurus
                </a>
            </li>
            <li>
                <a
                    class="nav-link relative font-medium text-gray-700 transition-colors hover:text-green-600"
                    href="/kegiatan">
                    Kegiatan
                </a>
            </li>

            <!-- Button Login khusus mobile -->
            <li class="mt-4 md:hidden">
                <a
                    href="/admin"
                    class="inline-block transform rounded-full bg-gradient-to-r from-green-500 to-emerald-600 px-8 py-2.5 font-medium text-white shadow-lg shadow-green-500/30 transition-all hover:-translate-y-0.5 hover:shadow-green-500/50">
                    Login Area
                </a>
            </li>
        </ul>

        <!-- Button Login Desktop -->
        <a
            href="/admin"
            class="hidden transform items-center justify-center rounded-full bg-gradient-to-r from-green-600 to-emerald-600 px-6 py-2 text-sm font-medium text-white shadow-lg shadow-green-600/20 transition-all duration-300 hover:-translate-y-0.5 hover:bg-green-700 hover:shadow-green-600/40 md:inline-flex">
            Login
        </a>
    </div>
</header>

<script>
    // Toggle menu mobile
    const menuIcon = document.getElementById('menu-icon')
    const menuList = document.getElementById('menu-list')

    menuIcon.addEventListener('click', () => {
        // Toggle opacity and translation classes for animation
        if (menuList.classList.contains('opacity-0')) {
            menuList.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none')
        } else {
            menuList.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none')
        }
    })

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!menuIcon.contains(e.target) && !menuList.contains(e.target)) {
            menuList.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none')
        }
    })
</script>

<style>
    /* Styling tambahan untuk indikator aktif/hover link */
    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -4px;
        left: 0;
        background-color: #10b981; /* emerald-500 */
        transition: width 0.3s ease;
    }
    .nav-link:hover::after {
        width: 100%;
    }
</style>
